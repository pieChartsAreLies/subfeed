[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subfeed"
version = "0.1.0"
description = "Subfeed service: subscriptions-only YouTube feed for Android TV"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "yt-dlp==2026.10.21"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
subfeed = "subfeed.cli:main"

[tool.setuptools]
packages = ["subfeed"]

[tool.setuptools.package-data]
subfeed = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
